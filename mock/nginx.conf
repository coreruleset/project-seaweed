server {
    listen 8080 default_server;
    server_tokens off;

    # Every path answers 200 with the same fingerprint page so that flow-gated Nuclei
    # templates get past their detection step and send their payload.
    error_page 405 =200 /fingerprints.html;

    location / {
        root /www;
        default_type text/html;
        try_files /fingerprints.html =404;
    }

    # Static files answer 405 to POST and friends; serve the page for those too, so the
    # backend does not turn a delivered payload into a backend artifact.
    location = /fingerprints.html {
        root /www;
        default_type text/html;
    }
}

name: Run Nuclei
on:
  # Run every sunday
  schedule:
    - cron: "0 12 * * SUN"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  scan:
    name: Scan and report
    runs-on: ubuntu-latest
    # The scan itself takes about a minute. This is a backstop against a hung
    # container burning six hours of runner time.
    timeout-minutes: 30
    outputs:
      slack_payload: ${{ steps.report.outputs.slack_payload }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Fetch the pinned templates
        # The version in .env is what makes one week's numbers comparable to the next.
        run: ./scripts/fetch-templates.sh

      - name: Run the scan
        # docker-compose.yml is the only definition of the test environment. It holds
        # nuclei behind a WAF healthcheck that proves a request round-trips to the
        # backend, so a broken backend fails this job instead of silently scoring every
        # payload as "not blocked".
        run: |
          mkdir -p output
          docker compose up --exit-code-from nuclei

      - name: zip output
        # Nuclei creates its trace directory as root with mode 0700, so the runner
        # cannot read it and `zip -qq` skips it without a word, leaving an empty
        # archive. Fail here if the scan produced nothing, rather than at the report.
        run: |
          sudo chmod -R a+rX output
          mkdir -p logs
          docker compose cp crs:/var/log/apache2/. logs/ \
            || echo "::warning::no WAF logs to collect"
          test -n "$(find output -name '*.txt' -print -quit)" || {
            echo "::error::the scan produced no trace files"
            exit 1
          }
          zip -qq -r output.zip output logs

      - name: GitHub Workflow artifacts
        # Uploaded before the report runs, so the traces and the WAF's own logs survive
        # a failed report — which is exactly when they are worth having.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: output
          path: output.zip

      - name: Build report
        id: report
        # Exits non-zero when too many requests got an upstream error instead of a
        # verdict, which turns the summary notification into a failure alert.
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          go build
          ./project-seaweed -o output >> "$GITHUB_OUTPUT"
          # One line of Block Kit, so it travels as a job output.
          echo "slack_payload=$(./project-seaweed -o output -f slack --run-url "$RUN_URL")" >> "$GITHUB_OUTPUT"

  slack-notification:
    name: Send notification
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    env:
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Success
        if: needs.scan.result == 'success'
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # Built by `seaweed -f slack`, so the layout is testable rather than assembled
          # from workflow expressions.
          payload: |
            ${{ needs.scan.outputs.slack_payload }}

      # A cancelled run stays silent; someone stopped it on purpose.
      - name: Failure
        if: needs.scan.result == 'failure'
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
            "text": "WAF test failed",
            "attachments": [
              {
                "color": "#d73a49",
                "blocks": [
                  {
                    "type": "header",
                    "text": { "type": "plain_text", "text": "WAF test failed", "emoji": true }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "The scan or the report failed, so there are no results this week."
                    }
                  },
                  {
                    "type": "context",
                    "elements": [{ "type": "mrkdwn", "text": "<${{ env.run_url }}|view the run>" }]
                  }
                ]
              }
              ]
            }

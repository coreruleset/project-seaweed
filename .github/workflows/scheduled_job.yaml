name: Run Nuclei
on:
  # Run every sunday
  schedule:
    - cron: "0 12 * * SUN"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-runner:
    name: Project runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run the scan
        # docker-compose.yml is the only definition of the test environment. It holds
        # nuclei behind a WAF healthcheck that proves a request round-trips to the
        # backend, so a broken backend fails this job instead of silently scoring every
        # payload as "not blocked".
        run: |
          mkdir -p output
          docker compose up --exit-code-from nuclei

      - name: zip output
        run: zip -qq -r output.zip output

      - name: GitHub Workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: output
          path: output.zip

  process-artifacts:
      name: Generate report
      runs-on: ubuntu-latest
      needs: [project-runner]
      outputs:
        total_requests: ${{ steps.report.outputs.total_requests }}
        total_errored: ${{ steps.report.outputs.total_errored }}
        cves_tested: ${{ steps.report.outputs.cves_tested }}
        cves_blocked: ${{ steps.report.outputs.cves_blocked }}
        cves_partially_blocked: ${{ steps.report.outputs.cves_partially_blocked }}
        cves_not_blocked: ${{ steps.report.outputs.cves_not_blocked }}
      steps:
        - name: Checkout code
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
          with:
            persist-credentials: false

        - name: Setup Go
          uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
          with:
            go-version-file: 'go.mod'

        - name: Download artifacts
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
          with:
            name: output

        - name: Build report
          id: report
          # Exits non-zero when too many requests got an upstream error instead of a
          # verdict, which skips the notification rather than reporting a broken run.
          run: |
            go build
            unzip -qq output.zip
            ./project-seaweed -o output >> "$GITHUB_OUTPUT"


  slack-notification:
   name: Send notification
   runs-on: ubuntu-latest
   needs: process-artifacts
   env:
     total_requests: ${{ needs.process-artifacts.outputs.total_requests }}
     total_errored: ${{ needs.process-artifacts.outputs.total_errored }}
     cves_tested: ${{ needs.process-artifacts.outputs.cves_tested }}
     cves_blocked: ${{ needs.process-artifacts.outputs.cves_blocked }}
     cves_partially_blocked: ${{ needs.process-artifacts.outputs.cves_partially_blocked }}
     cves_not_blocked: ${{ needs.process-artifacts.outputs.cves_not_blocked }}
   steps:
     - name: Success
       uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
       with:
         webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
         webhook-type: incoming-webhook
         payload: |
           {
           "text": "Testing finished!",
           "attachments": [
             {
               "color": "28a745",
               "fields": [
                 {
                   "title": "Status",
                   "value": "Complete"
                 },
                 {
                   "title": "CVEs tested",
                   "value": "${{ env.cves_tested }}"
                 },
                 {
                   "title": "CVEs blocked",
                   "value": "${{ env.cves_blocked }}"
                 },
                 {
                   "title": "CVEs partially blocked",
                   "value": "${{ env.cves_partially_blocked }}"
                 },
                 {
                   "title": "CVEs not blocked",
                   "value": "${{ env.cves_not_blocked }}"
                 },
                 {
                   "title": "requests sent",
                   "value": "${{ env.total_requests }}"
                 },
                 {
                   "title": "upstream errors",
                   "value": "${{ env.total_errored }}"
                 }
               ]
             }
             ]
           }


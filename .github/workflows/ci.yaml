name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: 'v2.13.1'
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: 'v1.7.12'

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Test
        run: go test -race -cover ./...

      - name: Build the mock backend page
        # The scan generates this page from the pinned templates on every run, so it can
        # never be stale. What can break is the harvester: a template format change it
        # stops matching yields a short page, and gen-mock's floor is what catches that.
        # Running it here means a pull request finds out, rather than Sunday's scan.
        run: |
          ./scripts/fetch-templates.sh
          go run . gen-mock

      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint workflows
        # Installed with the Go already set up above. actionlint also shellchecks the
        # run: blocks, which is where this repository's workflow logic lives.
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint"

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Findings come back as job annotations. Uploading them to code scanning
          # instead would need security-events: write.
          advanced-security: false

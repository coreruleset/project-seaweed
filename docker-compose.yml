services:
  mock:
    # Answers 200 with the fingerprint page for every path. Regenerate the page with
    # `go run . gen-mock` after bumping the version in scripts/fetch-templates.sh.
    image: "nginx:1.31-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752"
    volumes:
      - ./mock/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mock/fingerprints.html:/www/fingerprints.html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ | grep -q seaweed-mock-ok"]
      interval: 2s
      timeout: 3s
      retries: 15
  crs:
    image: "owasp/modsecurity-crs:4-apache-202404131004@sha256:9c20dd4756378de04c3587911efdf37c15614403c0540e008f16ca1cdbc63cba"
    environment:
      PORT: 8080
      BACKEND: "http://mock:8080"
      MODSEC_RULE_ENGINE: "On"
      # The whole point of a sweep: CRS gets more aggressive with each level, and the
      # cost of that is what the numbers are for.
      BLOCKING_PARANOIA: ${SEAWEED_PARANOIA:-4}
      MODSEC_AUDIT_LOG_FORMAT: JSON
      # A (transaction), B (request headers), H (the rule messages, which is the point),
      # Z (terminator). The default also stores request and response bodies, and the
      # mock's response body is the same page every time.
      MODSEC_AUDIT_LOG_PARTS: ABHZ
      # Serial writes one JSON object per transaction to a single file, which is far
      # easier to collect and read back than concurrent's thousands of files.
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: "/var/log/apache2/modsec_audit.json"
      MODSEC_TMP_DIR: "/tmp"
      # Apache only
      SERVERNAME: _default_
      # Every rule match goes to the error log. Left on stderr it drowns the run's
      # console output. These paths stay inside the container, whose /var/log/apache2 is
      # owned by the httpd user it runs as; a bind mount there is owned by the host user
      # instead and ModSecurity cannot create its audit log. Copy them out afterwards
      # with `docker compose cp crs:/var/log/apache2/. logs/`.
      ERRORLOG: "/var/log/apache2/error.log"
    hostname: crs
    # Published so host-side tools can reach the WAF: `seaweed false-positives` replays
    # the CRS regression suite from outside the compose network.
    ports:
      - "${SEAWEED_PORT:-8080}:8080"
    depends_on:
      mock:
        condition: service_healthy
    healthcheck:
      # Proves the mock's marker round-trips through the WAF, not just that Apache is
      # listening: an unreachable backend answers 503 and every payload then scores as
      # "not blocked". The User-Agent override is needed because CRS blocks curl's own.
      test:
        - "CMD-SHELL"
        - "curl -fsS -A 'Mozilla/5.0' http://127.0.0.1:8080/ | grep -q seaweed-mock-ok"
      interval: 3s
      timeout: 5s
      retries: 20
  nuclei:
    image: projectdiscovery/nuclei:latest@sha256:aa3a9c0894629405b5bbe644765dfffd6ff87b7663b5f1d64bcbc01341da335a
    hostname: nuclei
    # -dc keeps nuclei from merging templates that send identical requests into one
    # trace file headed by a cluster hash, whose requests cannot be attributed to a CVE.
    command: >-
      -u http://crs:8080
      -t /templates/http/cves
      -tags ${SEAWEED_TAGS:-lfi,xss,fileupload,xxe,injection,traversal,disclosure,auth-bypass,ssrf,sqli,oast,rce}
      -type http
      -stats
      -ni
      -sresp
      -srd /output
      -dc
      -duc
    volumes:
      - ${SEAWEED_OUTPUT:-./output}:/output:rw
      # Pinned by scripts/fetch-templates.sh, so week-to-week results are comparable
      # and mock/fingerprints.html is generated from the same templates the scan runs.
      - ./nuclei-templates:/templates:ro
    depends_on:
      crs:
        condition: service_healthy

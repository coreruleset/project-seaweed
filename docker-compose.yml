services:
  mock:
    # Answers 200 with the fingerprint page for every path. The page is generated, not
    # committed: run `go run . gen-mock` before bringing this up.
    image: "nginx:1.31-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752"
    volumes:
      - ./mock/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The directory, not the file: a single-file bind mount whose source does not exist
      # makes Docker create a *directory* there, which then breaks gen-mock itself. Mount
      # the directory and a missing page is an honest 404 that fails the healthcheck.
      - ./mock:/www:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ | grep -q seaweed-mock-ok"]
      interval: 2s
      timeout: 3s
      retries: 15
  crs:
    # A version-shaped tag, so Renovate can see it. The old pin was
    # 4-apache-202404131004, which it could not parse, so the WAF sat sixteen months and
    # 27 releases behind while everything measured against it looked current.
    image: "owasp/modsecurity-crs:4.28.0-apache-202608131208@sha256:a7aff2f12712f10248e8de7ac675466e9ddf8c999df09328bd5b4ad8df50223d"
    environment:
      PORT: 8080
      BACKEND: "http://mock:8080"
      MODSEC_RULE_ENGINE: "On"
      # The whole point of a sweep: CRS gets more aggressive with each level, and the
      # cost of that is what the numbers are for.
      BLOCKING_PARANOIA: ${SEAWEED_PARANOIA:-4}
      MODSEC_AUDIT_LOG_FORMAT: JSON
      # A (transaction), B (request headers), H (the rule messages, which is the point),
      # Z (terminator). The default also stores request and response bodies, and the
      # mock's response body is the same page every time.
      MODSEC_AUDIT_LOG_PARTS: ABHZ
      # Serial writes one JSON object per transaction to a single file, which is far
      # easier to collect and read back than concurrent's thousands of files.
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: "/var/log/apache2/modsec_audit.json"
      MODSEC_TMP_DIR: "/tmp"
      # Apache only
      SERVERNAME: _default_
      # Every rule match goes to the error log. Left on stderr it drowns the run's
      # console output. These paths stay inside the container, whose /var/log/apache2 is
      # owned by the httpd user it runs as; a bind mount there is owned by the host user
      # instead and ModSecurity cannot create its audit log. Copy them out afterwards
      # with `docker compose cp crs:/var/log/apache2/. logs/`.
      ERRORLOG: "/var/log/apache2/error.log"
    hostname: crs
    # Published so host-side tools can reach the WAF: `seaweed false-positives` replays
    # the CRS regression suite from outside the compose network.
    ports:
      - "${SEAWEED_PORT:-8080}:8080"
    depends_on:
      mock:
        condition: service_healthy
    healthcheck:
      # Proves the mock's marker round-trips through the WAF, not just that Apache is
      # listening: an unreachable backend answers 503 and every payload then scores as
      # "not blocked". The User-Agent override is needed because CRS blocks curl's own.
      test:
        - "CMD-SHELL"
        - "curl -fsS -A 'Mozilla/5.0' http://127.0.0.1:8080/ | grep -q seaweed-mock-ok"
      interval: 3s
      timeout: 5s
      retries: 20
  interactsh:
    # Templates that prove a vulnerability by calling out interpolate {{interactsh-url}},
    # and nuclei will not send the request without a server to get one from. Self-hosted
    # so nothing leaves the runner: the callback never arrives, because the domain does
    # not resolve, and it does not need to — what is measured is whether the WAF stopped
    # the request, not whether the target phoned home.
    image: "projectdiscovery/interactsh-server:latest"
    hostname: interactsh
    command: >-
      -domain oast.seaweed.test
      -skip-acme
      -disable-update-check
      -http-port 8080

  nuclei:
    image: projectdiscovery/nuclei:latest@sha256:aa3a9c0894629405b5bbe644765dfffd6ff87b7663b5f1d64bcbc01341da335a
    hostname: nuclei
    # -dc keeps nuclei from merging templates that send identical requests into one
    # trace file headed by a cluster hash, whose requests cannot be attributed to a CVE.
    #
    # -var supplies the credentials that templates attacking an authenticated endpoint
    # interpolate. Without them nuclei refuses to send the request — "unresolved variables
    # found: username,password" — and the CVE is reported as never exercised. The values
    # are irrelevant: the mock accepts anything, and what is measured is whether the WAF
    # stops the payload, not whether the login succeeds.
    command: >-
      -u http://crs:8080
      -t http/cves
      -tags ${SEAWEED_TAGS:-lfi,xss,fileupload,xxe,injection,traversal,disclosure,auth-bypass,ssrf,sqli,oast,rce}
      -type http
      -stats
      -iserver http://interactsh:8080
      -sresp
      -srd /output
      -dc
      -duc
      -var username=seaweed
      -var password=seaweed
      -var token=seaweed
      -var api_key=seaweed
    volumes:
      - ${SEAWEED_OUTPUT:-./output}:/output:rw
      # Pinned by scripts/fetch-templates.sh, so week-to-week results are comparable
      # and mock/fingerprints.html is generated from the same templates the scan runs.
      #
      # Mounted where nuclei keeps its own templates rather than at an arbitrary path:
      # it refuses to load payload wordlists from outside that directory, and templates
      # needing one fail to compile with "access to helper file ... denied".
      - ./nuclei-templates:/root/nuclei-templates:ro
    depends_on:
      crs:
        condition: service_healthy
      interactsh:
        condition: service_started
